[platformio]
description = Radio transmitter/receivers using Raspberry Pi Pico and RP2040 boards.

; This is the default environment that will be used when you run `pio run`
default_envs = pico_receiver

[env]
framework = arduino

; Use C++ version 17
build_unflags = -std=gnu++11

; Support C++ 17 and enable some warnings
build_flags = -std=gnu++17 -Wno-unused-variable -Wno-unused-but-set-variable -Wno-unused-function -Wno-format-extra-args

; Use clang-tidy when runnning `pio check`
; https://docs.platformio.org/en/stable/advanced/static-code-analysis/tools/clang-tidy.html
check_tool = clangtidy

; Serial monitor speed, make sure this is matched in Serial.begin()
monitor_speed = 115200

# Common global libraries. Uncomment any of these to include them in the build.
lib_deps =
  # USB support
  Adafruit TinyUSB Library

  # MIDI communication – send MIDI messages over USB or physical MIDI ports
  https://github.com/FortySevenEffects/arduino_midi_library

  # OSC communication – senc control messages over the network
  # cnmat/OSC

  # Smooth reading of analog signals, eg potentiometers, analog sensors, etc.
  # dxinteractive/ResponsiveAnalogRead

  # Debounce buttons – removes noise from button presses
  # thomasfredericks/Bounce2

  # SPI
  SPI

  # I2C
  Wire

  # USB support
  Adafruit TinyUSB Library

  # RFM69 radio
  https://github.com/adafruit/RadioHead

  # DNSServer
  # DNSServer

  # Schedule tasks, timers, etc.
  # arkhipenko/TaskScheduler

# Raspberry Pi Pico as Receiver
[env:pico_receiver]
platform = raspberrypi
board = pico
build_flags = ${env.build_flags} -D MR_IS_RECEIVER -D MR_PICO

# Raspberry Pi Pico as Transmitter
[env:pico_transmitter]
platform = raspberrypi
board = pico
build_flags = ${env.build_flags} -D MR_IS_TRANSMITTER -D MR_PICO

[env:rpipico2_receiver]
platform = raspberrypi
board = rpipico2
build_flags = ${env.build_flags} -D MR_IS_RECEIVER -D MR_PICO2

[env:rpipico2_transmitter]
platform = raspberrypi
board = rpipico2
build_flags = ${env.build_flags} -D MR_IS_TRANSMITTER -D MR_PICO2

# Feather RP2040 RFM as Receiver
[env:adafruit_feather_rfm_receiver]
board = adafruit_feather_rfm
build_flags = ${env.build_flags} -D MR_IS_RECEIVER
platform = raspberrypi

# Feather RP2040 RFM as Transmitter
[env:adafruit_feather_rfm_transmitter]
board = adafruit_feather_rfm
build_flags = ${env.build_flags} -D MR_IS_TRANSMITTER
platform = raspberrypi
